name: Build x64 with all deps (Release)

# triggers:
on:
  # use push only when debugging this workflow
  #push:
  # run this action when kicked off manually
  workflow_dispatch:
  # Automatic runs on branch/tag creation and published releases are disabled in this fork:
  # the dependency build scripts (extras/scripts) still target Visual Studio 2019, which is not on GitHub's runners.
  # Releases use the prebuilt libraries in the repository, like the regular builds.
  #create:
  #release:
  #  types: [published]

jobs:
  call-workflow-build-x64:
    uses: ./.github/workflows/workflow-rebuild-all-deps.yml
    with:
      platform-arch: x64
