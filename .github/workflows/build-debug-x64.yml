name: Build Test x64 (Debug)

# Manual runs only (Actions tab -> "Run workflow"): the Debug build does not link at the moment, as the prebuilt
# bit7z.lib (from JPEGView_L) is a Release (/MT) library only. Use [push, pull_request] again once a Debug bit7z.lib exists.
on:
  workflow_dispatch:

jobs:
  call-workflow-build:
    uses: ./.github/workflows/workflow-build-wtl-cache.yml
    with:
      platform-arch: x64
      build-config: Debug
